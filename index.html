<style>
/* ---- design-tokens-lab (src/styles/tokens/*.css @ 1ce7fa9), copied verbatim. Edit there, then re-copy. ---- */
@layer reset, tokens, base, components;
/* GENERATED FILE — do not edit. Source: tokens.json. Run `npm run tokens`. */
/*
 * Primitive tokens: the raw palette and scales.
 * Components must NOT use these directly — go through semantic.css.
 * Rationale: primitives are "what values exist", semantics are "what they mean".
 * Theming (dark mode, brands) swaps the semantic layer; primitives stay fixed.
 */
@layer tokens {
  :root {
  --color-gray-0: #ffffff;
  --color-gray-50: #f7f7f8;
  --color-gray-100: #eeeef0;
  --color-gray-200: #dcdce1;

  --color-gray-800: #26262d;
  --color-gray-900: #161619;
  --color-gray-1000: #0b0b0d;
  --color-indigo-50: #f2f3fd;
  --color-indigo-100: #e6e8fb;
  --color-indigo-300: #a6adf2;
  --color-indigo-500: #4f5be6;
  --color-indigo-600: #3d48cc;
  --color-indigo-700: #2f38a3;
  --color-teal-100: #d9f5f0;
  --color-teal-300: #7fd8c8;
  --color-teal-500: #149c87;
  --color-teal-600: #0f7f6e;
  --color-teal-700: #0b6355;
  --color-red-100: #fde8e8;

  --color-red-500: #d92d2d;
  --color-red-600: #b52424;
  --color-red-700: #8f1c1c;

  --color-amber-500: #d98c0a;
  --color-amber-600: #b47308;
  --color-amber-700: #8c5a06;
  --color-green-100: #e1f5e6;
  --color-green-300: #8fdba6;
  --color-green-500: #1f9d4d;
  --color-green-600: #187f3e;
  --color-green-700: #12622f;
  --color-sky-100: #e0f1fd;
  --color-sky-300: #86c7f5;
  --color-sky-500: #1a8ae0;
  --color-sky-600: #146fb5;
  --color-sky-700: #0f548a;

  --color-rose-600: #b52459;

  --color-orange-100: #fdeadb;
  --color-orange-300: #f7b27f;
  --color-orange-500: #e8641a;
  --color-orange-600: #c25114;
  --color-orange-700: #984010;
  --space-0: 0;
  --space-1: 0.25rem;

  --font-family-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-family-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-size-xs: 0.75rem;

  --font-weight-regular: 400;

  --font-leading-tight: 1.2;

  --radius-none: 0;
  --radius-sm: 4px;
  --radius-md: 8px;

  --radius-xl: 20px;
  --radius-full: 9999px;
  --shadow-xs: 0 1px 1px rgb(0 0 0 / 0.04);
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.06);
  --shadow-md: 0 4px 12px rgb(0 0 0 / 0.10);
  --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.16);
  --duration-fast: 120ms;

  --duration-slow: 320ms;
  --z-dropdown: 100;

  }

/*
 * Semantic tokens: what a value MEANS in the UI.
 * These alias primitives. Components read ONLY these.
 *
 * Naming convention:  --<category>-<role>[-<state>]
 *   --color-bg-surface, --color-fg-muted, --color-primary-hover
 *
 * Theming: the dark theme re-points the same names at different primitives.
 * No component changes when a theme changes — that is the whole point.
 *
 * Brands live in brands.css and re-point a SUBSET of these (primary,
 * secondary, radius, type). Density lives at the bottom of this file.
 */
@layer tokens {
  :root {
    color-scheme: light;

    /* ---- Brand / action colours ---- */
    --color-primary: var(--color-indigo-500);
    --color-primary-hover: var(--color-indigo-600);
    --color-primary-active: var(--color-indigo-700);
    --color-primary-subtle: var(--color-indigo-100);
    --color-primary-subtle-hover: var(--color-indigo-50);
    --color-on-primary: var(--color-gray-0);

    --color-secondary: var(--color-teal-500);
    --color-secondary-hover: var(--color-teal-600);
    --color-secondary-active: var(--color-teal-700);
    --color-secondary-subtle: var(--color-teal-100);
    --color-on-secondary: var(--color-gray-0);

    /* Tertiary: the "extension point" from the first version, now real. */
    --color-tertiary: var(--color-amber-500);
    --color-tertiary-hover: var(--color-amber-600);
    --color-tertiary-active: var(--color-amber-700);
    --color-tertiary-subtle: var(--color-amber-100);
    --color-on-tertiary: var(--color-gray-1000);

    /* ---- Backgrounds (bg) and foregrounds (fg) ---- */
    --color-bg-canvas: var(--color-gray-50);
    --color-bg-surface: var(--color-gray-0);
    --color-bg-surface-raised: var(--color-gray-0);
    --color-bg-muted: var(--color-gray-100);
    --color-bg-hover: var(--color-gray-100);
    --color-bg-active: var(--color-gray-200);
    --color-bg-inverse: var(--color-gray-900);
    --color-bg-backdrop: rgb(0 0 0 / 0.4);

    --color-fg: var(--color-gray-900);
    --color-fg-muted: var(--color-gray-600);
    --color-fg-subtle: var(--color-gray-500);
    --color-fg-disabled: var(--color-gray-400);
    --color-fg-inverse: var(--color-gray-50);
    --color-fg-link: var(--color-primary);

    --color-border: var(--color-gray-200);
    --color-border-strong: var(--color-gray-300);
    --color-border-focus: var(--color-primary);

    /* ---- Feedback ---- */
    --color-danger: var(--color-red-500);
    --color-danger-hover: var(--color-red-600);
    --color-danger-active: var(--color-red-700);
    --color-danger-subtle: var(--color-red-100);
    --color-on-danger: var(--color-gray-0);

    --color-warning: var(--color-amber-500);
    --color-warning-subtle: var(--color-amber-100);

    --color-success: var(--color-green-500);
    --color-success-subtle: var(--color-green-100);

    --color-info: var(--color-sky-500);
    --color-info-subtle: var(--color-sky-100);

    /* ---- Focus ring — one definition, every component uses it ---- */
    --focus-ring: 0 0 0 3px color-mix(in srgb, var(--color-border-focus) 40%, transparent);

    /* ---- Shape ---- */
    --radius-control: var(--radius-md);   /* buttons, inputs, tabs */
    --radius-surface: var(--radius-lg);   /* cards, dialogs, popovers */
    --radius-pill: var(--radius-full);    /* badges, avatars, switches */

    /* ---- Elevation ---- */
    --shadow-surface: var(--shadow-sm);
    --shadow-popover: var(--shadow-md);
    --shadow-overlay: var(--shadow-lg);

    /* ---- Type roles ---- */
    --font-body: var(--font-family-sans);
    --font-heading: var(--font-family-sans);
    --font-weight-heading: var(--font-weight-semibold);

    /* ---- Controls (density re-points these) ---- */
    --control-height-sm: 2rem;
    --control-height-md: 2.5rem;
    --control-height-lg: 3rem;
    --control-padding-x: var(--space-4);
    --space-inset-surface: var(--space-5);   /* card / dialog / popover padding */
    --space-stack-default: var(--space-4);

    --transition-base: var(--duration-fast) ease-out;
    --transition-overlay: var(--duration-normal) ease-out;

    /*
     * ---- Charts ----
     * The one place this system needed NEW semantic roles (doc 06, step 1):
     * --color-primary is one colour; a multi-series chart needs several that
     * are distinguishable from each other, under colour-vision deficiency,
     * in both themes. So these are not hand-picked. The hue ORDER and the
     * step per mode were found by searching every ordering of the eight
     * chromatic primitives and keeping only those that pass the dataviz
     * validator (OKLCH lightness band, chroma floor, adjacent CVD ΔE ≥ 8,
     * normal-vision ΔE ≥ 15, ≥ 3:1 on --color-bg-surface). See docs/08.
     *
     * Rules of use:
     *   - Assign slots in order, by entity, never by rank. A filter that
     *     removes series must not repaint the survivors.
     *   - Never cycle past 8: fold into "Other" or facet.
     *   - Slots 1–3 also pass ALL-pairs; scatter/bubble/maps cap at three.
     *   - Status (--color-danger/warning/success) is never a series colour;
     *     these steps are chosen so they don't collide with those tokens.
     *   - Text never wears a series colour; labels use --color-fg-*.
     */
    --chart-1: var(--color-indigo-500);
    --chart-2: var(--color-orange-500);
    --chart-3: var(--color-teal-500);
    --chart-4: var(--color-amber-600);
    --chart-5: var(--color-rose-500);
    --chart-6: var(--color-green-600);
    --chart-7: var(--color-sky-600);
    --chart-8: var(--color-red-600);

    /* Emphasis form: one series in the accent, the rest recede to this. */
    --chart-muted: var(--color-gray-300);
    /* Sequential (magnitude): one hue, light → dark. Validated as an ordinal ramp. */
    --chart-seq-1: var(--color-indigo-300);
    --chart-seq-2: var(--color-indigo-500);
    --chart-seq-3: var(--color-indigo-600);
    --chart-seq-4: var(--color-indigo-700);
    /* Diverging (polarity): cool pole ↔ neutral ↔ warm pole. */
    --chart-div-neg: var(--color-indigo-500);
    --chart-div-mid: var(--color-gray-100);
    --chart-div-pos: var(--color-orange-500);
    /* Chrome: recessive by design. Hairline grid one step off the surface. */
    --chart-grid: var(--color-gray-100);
    --chart-axis: var(--color-gray-300);
    --chart-crosshair: var(--color-gray-400);
    --chart-surface: var(--color-bg-surface);
  }

  /* ---- Dark theme: same names, different targets ---- */
  :root[data-theme="dark"] {
    color-scheme: dark;

    --color-primary: var(--color-indigo-300);
    --color-primary-hover: var(--color-indigo-100);
    --color-primary-active: var(--color-indigo-500);
    --color-primary-subtle: color-mix(in srgb, var(--color-indigo-500) 25%, transparent);
    --color-primary-subtle-hover: color-mix(in srgb, var(--color-indigo-500) 35%, transparent);
    --color-on-primary: var(--color-gray-1000);

    --color-secondary: var(--color-teal-300);
    --color-secondary-hover: var(--color-teal-100);
    --color-secondary-active: var(--color-teal-500);
    --color-secondary-subtle: color-mix(in srgb, var(--color-teal-500) 25%, transparent);
    --color-on-secondary: var(--color-gray-1000);

    --color-tertiary: var(--color-amber-300);
    --color-tertiary-hover: var(--color-amber-100);
    --color-tertiary-active: var(--color-amber-500);
    --color-tertiary-subtle: color-mix(in srgb, var(--color-amber-500) 25%, transparent);
    --color-on-tertiary: var(--color-gray-1000);

    --color-bg-canvas: var(--color-gray-1000);
    --color-bg-surface: var(--color-gray-900);
    --color-bg-surface-raised: var(--color-gray-800);
    --color-bg-muted: var(--color-gray-800);
    --color-bg-hover: var(--color-gray-800);
    --color-bg-active: var(--color-gray-700);
    --color-bg-inverse: var(--color-gray-50);
    --color-bg-backdrop: rgb(0 0 0 / 0.6);

    --color-fg: var(--color-gray-50);
    --color-fg-muted: var(--color-gray-300);
    --color-fg-subtle: var(--color-gray-400);
    --color-fg-disabled: var(--color-gray-600);
    --color-fg-inverse: var(--color-gray-900);

    --color-border: var(--color-gray-700);
    --color-border-strong: var(--color-gray-600);

    --color-danger: var(--color-red-300);
    --color-danger-hover: var(--color-red-100);
    --color-danger-active: var(--color-red-500);
    --color-danger-subtle: color-mix(in srgb, var(--color-red-500) 25%, transparent);
    --color-on-danger: var(--color-gray-1000);
    --color-warning: var(--color-amber-300);
    --color-warning-subtle: color-mix(in srgb, var(--color-amber-500) 25%, transparent);
    --color-success: var(--color-green-300);
    --color-success-subtle: color-mix(in srgb, var(--color-green-500) 25%, transparent);
    --color-info: var(--color-sky-300);
    --color-info-subtle: color-mix(in srgb, var(--color-sky-500) 25%, transparent);

    --shadow-surface: 0 1px 2px rgb(0 0 0 / 0.4);
    --shadow-popover: 0 4px 16px rgb(0 0 0 / 0.5);
    --shadow-overlay: 0 12px 32px rgb(0 0 0 / 0.6);

    /*
     * Charts, dark: the SAME hue order, re-stepped for the dark surface and
     * validated separately (dark is selected, never an automatic flip).
     * Six of eight slots keep their step; sky and red move to 500 because
     * the 600s fall below 3:1 on gray-900.
     */
    --chart-7: var(--color-sky-500);
    --chart-8: var(--color-red-500);
    --chart-muted: var(--color-gray-600);
    /* Dark ramp starts at 600: indigo-700 is 1.9:1 on this surface. */
    --chart-seq-1: var(--color-indigo-600);
    --chart-seq-2: var(--color-indigo-500);
    --chart-seq-3: var(--color-indigo-300);
    --chart-seq-4: var(--color-indigo-100);
    --chart-div-mid: var(--color-gray-800);
    --chart-grid: var(--color-gray-800);
    --chart-axis: var(--color-gray-700);
    --chart-crosshair: var(--color-gray-500);
  }

  /*
   * ---- Density ----
   * Same mechanism as themes: re-point the control tokens. Scoped to any
   * subtree, so a data table can be compact inside a comfortable page.
   */
  [data-density="compact"] {
    --control-height-sm: 1.75rem;
    --control-height-md: 2.125rem;
    --control-height-lg: 2.5rem;
    --control-padding-x: var(--space-3);
    --space-inset-surface: var(--space-4);
    --space-stack-default: var(--space-3);
  }

  [data-density="spacious"] {
    --control-height-sm: 2.25rem;
    --control-height-md: 2.75rem;
    --control-height-lg: 3.25rem;
    --control-padding-x: var(--space-5);
    --space-inset-surface: var(--space-6);
    --space-stack-default: var(--space-5);
  }
}

/*
 * "Arcade": Star Defender's brand, in the portfolio's terminal style (lab
 * neutrals, flat fills, small radii, one accent) with orange as the accent.
 * Dark only, so it overrides the dark theme's action colours directly.
 */
@layer tokens {
  :root[data-theme="dark"] {
    --color-primary: var(--color-orange-300);
    --color-primary-hover: var(--color-orange-100);
    --color-primary-active: var(--color-orange-500);
    --color-primary-subtle: color-mix(in srgb, var(--color-orange-500) 22%, transparent);
    --color-primary-subtle-hover: color-mix(in srgb, var(--color-orange-500) 32%, transparent);
    --color-on-primary: var(--color-gray-1000);

    --radius-control: var(--radius-sm);
    --radius-surface: var(--radius-md);
  }
}

/*
 * Game roles: Star Defender's own names on top of the lab, like Job Tracker's
 * --stage-*. Sprites read ONLY these (the canvas script resolves them once), so
 * every colour on screen comes from the lab palette. Dark theme only: it's space.
 */
@layer tokens {
  :root {
    --game-sky: var(--color-gray-900);
    --game-ship: var(--color-gray-100);
    --game-glow: var(--color-primary);
    --game-shot: var(--color-primary);
    --game-enemy: var(--color-sky-300);
    --game-enemy-tough: var(--color-rose-300);
    --game-enemy-shot: var(--color-red-300);
    --game-powerup: var(--color-tertiary);
    --game-flame: var(--color-orange-500);
    --game-hp-track: var(--color-border);
    --game-star: var(--color-fg);
  }
}
@layer base {
  html,body{margin:0;height:100%;background:var(--color-bg-canvas);overflow:hidden;font-family:var(--font-body);color:var(--color-fg);touch-action:none;user-select:none}
  canvas{display:block;margin:0 auto;background:radial-gradient(ellipse at top,var(--game-sky) 0%,var(--color-bg-canvas) 70%)}
}
@layer components {
  #hud{position:fixed;top:var(--space-3);left:0;right:0;display:flex;justify-content:space-between;padding:0 var(--space-4);font-weight:var(--font-weight-semibold);font-size:var(--font-size-md);font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:0 0 6px var(--game-glow)}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:color-mix(in srgb,var(--color-bg-canvas) 70%,transparent);padding:var(--space-4)}
  #overlay h1{font-family:var(--font-heading);font-weight:var(--font-weight-bold);font-size:clamp(32px,8vw,64px);margin:0 0 var(--space-2);letter-spacing:2px;color:var(--color-primary)}
  #overlay p{margin:var(--space-1) 0;color:var(--color-fg-muted);max-width:420px}
  #overlay #best{color:var(--color-fg)}
  button{margin-top:var(--space-5);font:inherit;font-size:var(--font-size-lg);font-weight:var(--font-weight-bold);min-height:var(--control-height-lg);padding:0 var(--space-8);border:0;border-radius:var(--radius-control);color:var(--color-on-primary);background:var(--color-primary);cursor:pointer;transition:background-color var(--transition-base)}
  button:hover{background:var(--color-primary-hover)}
  button:active{background:var(--color-primary-active)}
  button:focus-visible{outline:none;box-shadow:var(--focus-ring)}
  .hidden{display:none!important}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="score">Score 0</span><span id="wave">Wave 1</span><span id="lives">♥♥♥</span></div>
<div id="overlay">
  <h1>STAR DEFENDER</h1>
  <p id="msg">Destroy the invaders. Survive the waves.</p>
  <p>Move: ← → / A D or drag &nbsp;·&nbsp; Fire: Space (auto-fire on touch) &nbsp;·&nbsp; P: pause</p>
  <p id="best"></p>
  <button id="start">Play</button>
</div>
<script>
(() => {
  const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
  const $ = id => document.getElementById(id);
  // Sprite colours: the --game-* roles (design-tokens-lab), resolved once to concrete colours.
  const css = getComputedStyle(document.documentElement);
  const role = name => css.getPropertyValue(`--game-${name}`).trim();
  const C = { ship: role('ship'), glow: role('glow'), shot: role('shot'), enemy: role('enemy'), tough: role('enemy-tough'),
              enemyShot: role('enemy-shot'), powerup: role('powerup'), flame: role('flame'), hpTrack: role('hp-track'),
              star: role('star'), bg: css.getPropertyValue('--color-bg-canvas').trim(), fg: css.getPropertyValue('--color-fg').trim() };
  const FONT = css.getPropertyValue('--font-body').trim();
  let W, H;
  function resize(){ W = cvs.width = Math.min(innerWidth, 720); H = cvs.height = innerHeight; }
  addEventListener('resize', resize); resize();

  const store = { get(){ try { return +localStorage.getItem('sd-best') || 0 } catch { return 0 } },
                  set(v){ try { localStorage.setItem('sd-best', v) } catch {} } };
  let best = store.get();
  const showBest = () => $('best').textContent = best ? `Best: ${best}` : '';
  showBest();

  // Audio (tiny synth beeps)
  let ac;
  function beep(freq, dur, type='square', vol=.05){
    try {
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch {}
  }

  const stars = Array.from({length:120}, () => ({x:Math.random()*720, y:Math.random()*2000, s:Math.random()*2+.3}));
  const keys = {};
  let state = 'menu', player, bullets, enemies, eBullets, parts, powerups, score, lives, wave, fireCd, shake, inv, touchX = null, rapid;

  function reset(){
    player = {x:W/2, y:H-70, w:34, h:30, speed:420};
    bullets=[]; enemies=[]; eBullets=[]; parts=[]; powerups=[];
    score=0; lives=3; wave=0; fireCd=0; shake=0; inv=0; rapid=0;
    nextWave();
  }

  function nextWave(){
    wave++;
    const rows = Math.min(2 + Math.floor(wave/2), 6), cols = Math.min(5 + wave, 9);
    const gap = Math.min(60, (W-60)/cols);
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
      const tough = r === 0 && wave > 2;
      enemies.push({ x: W/2 - (cols-1)*gap/2 + c*gap, y: -40 - r*48, ty: 70 + r*46, w:28, h:22,
        hp: tough ? 3 : 1, max: tough ? 3 : 1, phase: Math.random()*6.28, kind: tough ? 1 : 0 });
    }
    $('wave').textContent = `Wave ${wave}`;
  }

  function burst(x, y, color, n=14){
    for (let i=0;i<n;i++){ const a=Math.random()*6.28, s=Math.random()*220+40;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6,color}); }
  }

  function hit(a, b){ return Math.abs(a.x-b.x) < (a.w+b.w)/2 && Math.abs(a.y-b.y) < (a.h+b.h)/2; }

  function update(dt){
    // player movement
    let dx = (keys.ArrowRight||keys.KeyD ? 1 : 0) - (keys.ArrowLeft||keys.KeyA ? 1 : 0);
    if (touchX !== null) dx = Math.max(-1, Math.min(1, (touchX - player.x)/40));
    player.x = Math.max(20, Math.min(W-20, player.x + dx*player.speed*dt));
    player.y = H - 70;

    fireCd -= dt; rapid = Math.max(0, rapid - dt); inv = Math.max(0, inv - dt);
    if ((keys.Space || touchX !== null) && fireCd <= 0){
      fireCd = rapid ? .09 : .22;
      bullets.push({x:player.x, y:player.y-18, w:4, h:12, vy:-640});
      if (rapid){ bullets.push({x:player.x-12,y:player.y-8,w:4,h:12,vy:-620,vx:-80}, {x:player.x+12,y:player.y-8,w:4,h:12,vy:-620,vx:80}); }
      beep(880, .05, 'square', .03);
    }

    bullets.forEach(b => { b.y += b.vy*dt; b.x += (b.vx||0)*dt; });
    bullets = bullets.filter(b => b.y > -20);

    const t = performance.now()/1000, spd = 1 + wave*.12;
    enemies.forEach(e => {
      if (e.y < e.ty) e.y += 120*dt;
      else { e.ty += 6*dt*spd; e.y = e.ty; }
      e.dx = Math.sin(t*1.4*spd + e.phase) * 60 * dt;
      e.x = Math.max(16, Math.min(W-16, e.x + e.dx));
      if (Math.random() < dt * (.08 + wave*.03)) eBullets.push({x:e.x, y:e.y+12, w:5, h:10, vy:200 + wave*15});
      if (e.y > H - 100) { lives = 0; }
    });

    eBullets.forEach(b => b.y += b.vy*dt);
    eBullets = eBullets.filter(b => b.y < H+20);

    // collisions
    for (const b of bullets) for (const e of enemies) if (!b.dead && e.hp > 0 && hit(b,e)){
      b.dead = true; e.hp--;
      if (e.hp <= 0){ score += e.kind ? 50 : 10; burst(e.x,e.y, e.kind ? C.tough : C.enemy); beep(180,.15,'sawtooth',.05);
        if (Math.random() < .06) powerups.push({x:e.x,y:e.y,w:18,h:18}); }
      else beep(400,.04);
    }
    bullets = bullets.filter(b => !b.dead);
    enemies = enemies.filter(e => e.hp > 0);

    powerups.forEach(p => p.y += 120*dt);
    powerups = powerups.filter(p => { if (hit(p,player)){ rapid = 8; beep(1200,.2,'triangle',.06); return false } return p.y < H+20; });

    if (!inv) for (const b of eBullets) if (hit(b, {x:player.x,y:player.y,w:24,h:22})){
      b.y = H+100; lives--; inv = 1.5; shake = .4; burst(player.x,player.y,C.flame,24); beep(90,.4,'sawtooth',.08); break;
    }

    parts.forEach(p => { p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; });
    parts = parts.filter(p => p.life > 0);
    shake = Math.max(0, shake - dt);

    if (!enemies.length) { score += wave*100; nextWave(); }
    $('score').textContent = `Score ${score}`;
    $('lives').textContent = '♥'.repeat(Math.max(0,lives));
    if (lives <= 0) gameOver();
  }

  function drawShip(x, y){
    ctx.save(); ctx.translate(x,y);
    ctx.shadowColor = C.glow; ctx.shadowBlur = 14; ctx.fillStyle = C.ship;
    ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(16,14); ctx.lineTo(0,7); ctx.lineTo(-16,14); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = .7 + Math.random()*.3; ctx.fillStyle = C.flame; ctx.shadowColor = C.flame;
    ctx.beginPath(); ctx.moveTo(-5,10); ctx.lineTo(0,20+Math.random()*8); ctx.lineTo(5,10); ctx.fill();
    ctx.restore();
  }

  function drawEnemy(e){
    ctx.save(); ctx.translate(e.x,e.y);
    const c = e.kind ? C.tough : C.enemy;
    ctx.shadowColor = c; ctx.shadowBlur = 12; ctx.fillStyle = c;
    ctx.beginPath(); ctx.moveTo(-14,-8); ctx.lineTo(14,-8); ctx.lineTo(10,6); ctx.lineTo(4,2); ctx.lineTo(0,10); ctx.lineTo(-4,2); ctx.lineTo(-10,6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.bg; ctx.fillRect(-7,-4,4,4); ctx.fillRect(3,-4,4,4);
    if (e.max > 1){ ctx.shadowBlur=0; ctx.fillStyle=C.hpTrack; ctx.fillRect(-14,-16,28,3); ctx.fillStyle=c; ctx.fillRect(-14,-16,28*e.hp/e.max,3); }
    ctx.restore();
  }

  function draw(dt){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);
    if (shake) ctx.translate((Math.random()-.5)*12*shake/.4, (Math.random()-.5)*12*shake/.4);
    // stars
    for (const s of stars){ s.y += s.s*40*dt; if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
      ctx.globalAlpha = s.s/2.5; ctx.fillStyle = C.star; ctx.fillRect(s.x % W, s.y, s.s, s.s); }
    ctx.globalAlpha = 1;
    if (state === 'menu') return;
    ctx.shadowBlur = 10;
    ctx.fillStyle = C.shot; ctx.shadowColor = C.shot;
    bullets.forEach(b => ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h));
    ctx.fillStyle = C.enemyShot; ctx.shadowColor = C.enemyShot;
    eBullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x,b.y,4,0,6.28); ctx.fill(); });
    ctx.fillStyle = C.powerup; ctx.shadowColor = C.powerup;
    powerups.forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,9,0,6.28); ctx.fill(); ctx.fillStyle=C.bg; ctx.font=`bold 12px ${FONT}`; ctx.textAlign='center'; ctx.fillText('R',p.x,p.y+4); ctx.fillStyle=C.powerup; });
    ctx.shadowBlur = 0;
    enemies.forEach(drawEnemy);
    if (!inv || Math.floor(inv*10)%2) drawShip(player.x, player.y);
    parts.forEach(p => { ctx.globalAlpha = p.life/.6; ctx.fillStyle = p.color; ctx.fillRect(p.x,p.y,3,3); });
    ctx.globalAlpha = 1;
    if (state === 'paused'){ ctx.fillStyle=C.fg; ctx.font=`bold 36px ${FONT}`; ctx.textAlign='center'; ctx.fillText('PAUSED', W/2, H/2); }
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(.05, (now - last)/1000); last = now;
    if (state === 'play') update(dt);
    draw(state === 'paused' ? 0 : dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function start(){ reset(); state = 'play'; $('overlay').classList.add('hidden'); }
  function gameOver(){
    state = 'menu';
    if (score > best){ best = score; store.set(best); }
    $('msg').textContent = `Game over — you scored ${score} on wave ${wave}.`;
    $('start').textContent = 'Play again'; showBest();
    $('overlay').classList.remove('hidden');
  }

  $('start').onclick = start;
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.code === 'KeyP' && state !== 'menu') state = state === 'play' ? 'paused' : 'play';
    if (e.code === 'Enter' && state === 'menu') start();
  });
  addEventListener('keyup', e => keys[e.code] = false);
  const rect = () => cvs.getBoundingClientRect();
  cvs.addEventListener('pointerdown', e => { touchX = e.clientX - rect().left; });
  cvs.addEventListener('pointermove', e => { if (touchX !== null) touchX = e.clientX - rect().left; });
  addEventListener('pointerup', () => touchX = null);
  addEventListener('pointercancel', () => touchX = null);
})();
</script>
</body>
</html>
